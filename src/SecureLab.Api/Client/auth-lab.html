<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>ЛР 03 — сеанс</title>
<link rel="stylesheet" href="auth-lab.css">
</head>
<body>
<h1>Навчальний сеанс</h1>
<p>Стан сеансу: <span id="state">перевіряється…</span></p>

<section>
  <h2>Реєстрація</h2>
  <form id="register">
    <label>Ім’я користувача <input name="userName" autocomplete="username" required></label>
    <label>Email <input name="email" type="email" autocomplete="email" required></label>
    <label>Відображуване ім’я <input name="displayName" required maxlength="120"></label>
    <label>Пароль <input name="password" type="password" autocomplete="new-password" required></label>
    <button>Зареєструватися</button>
  </form>
  <pre id="register-result"></pre>
</section>

<section>
  <h2>Вхід</h2>
  <form id="login">
    <label>Ім’я <input name="userName" autocomplete="username" required></label>
    <label>Пароль <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Увійти</button>
  </form>
  <button id="me" type="button">Мій профіль</button>
  <button id="logout" type="button">Вийти</button>
  <pre id="result"></pre>
</section>

<section>
  <h2>Профіль</h2>
  <dl id="profile"></dl>
</section>

<section>
  <h2>Новий інцидент</h2>
  <form id="create">
    <label>Назва <input name="title" required maxlength="160"></label>
    <label>Опис <textarea name="description" rows="3" required maxlength="4000"></textarea></label>
    <label>Severity
      <select name="severity">
        <option>Low</option><option>Medium</option><option>High</option><option>Critical</option>
      </select>
    </label>
    <label>Час інциденту <input name="occurredAt" type="datetime-local" required></label>
    <button>Створити</button>
  </form>
  <pre id="create-result"></pre>
</section>

<script src="auth-lab.js" defer></script>
</body>
</html>
